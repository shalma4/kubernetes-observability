apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-app
  namespace: observability

spec:
  replicas: 2

  selector:
    matchLabels:
      app: observability-app

  template:
    metadata:
      labels:
        app: observability-app

    spec:
      containers:
        - name: observability-app
          image: observability-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
